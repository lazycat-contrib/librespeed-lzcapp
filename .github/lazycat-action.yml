version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: librespeed
build:
  toolchains: []
  run_buildscript: false
images:
  - id: librespeed
    target: service
    service: librespeed
    source: ghcr.io/librespeed/speedtest
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    skip_if_version_exists: true
    name: LibreSpeed
    summary: 测试浏览器到微服的网络链路速度
